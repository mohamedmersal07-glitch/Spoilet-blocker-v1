
name: Build SpoilerBlocker APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Extract project
        run: unzip -o SpoilerBlocker_APK_Build_Ready.zip
        
      - name: Fix accessibility XML
        run: sed -i 's/android:flags=/android:accessibilityFlags=/g' SpoilerBlocker/app/src/main/res/xml/spoiler_accessibility.xml


      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      

     
      - name: Install Android SDK
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"


      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build APK
        working-directory: SpoilerBlocker
        run: gradle --no-daemon :app:assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: SpoilerBlocker-APK
          path: SpoilerBlocker/app/build/outputs/apk/debug/app-debug.apk
