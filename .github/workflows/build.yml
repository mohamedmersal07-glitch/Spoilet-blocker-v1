name: Build SpoilerBlocker v0.2 APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Extract reviewed source
        run: |
          unzip -o SpoilerBlocker_Reviewed_v0.2_Source.zip
          test -s SpoilerBlocker/app/src/main/AndroidManifest.xml

      - name: Install Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK requirements
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-35" "build-tools;35.0.0"

      - name: Install Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Run matcher tests
        working-directory: SpoilerBlocker
        run: bash scripts/test-matcher.sh

      - name: Build debug APK and AAB for internal sharing
        working-directory: SpoilerBlocker
        run: gradle --no-daemon :app:assembleDebug :app:bundleDebug

      - name: Check outputs
        run: |
          test -s SpoilerBlocker/app/build/outputs/apk/debug/app-debug.apk
          test -s SpoilerBlocker/app/build/outputs/bundle/debug/app-debug.aab
          sha256sum SpoilerBlocker/app/build/outputs/apk/debug/app-debug.apk

      - name: Upload test APK
        uses: actions/upload-artifact@v4
        with:
          name: SpoilerBlocker-v0.2-APK
          path: SpoilerBlocker/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload test App Bundle
        uses: actions/upload-artifact@v4
        with:
          name: SpoilerBlocker-v0.2-AAB
          path: SpoilerBlocker/app/build/outputs/bundle/debug/app-debug.aab
          if-no-files-found: error
